# Hub grid-operator (0.2.0)

swim:
  siteName: hub
  # Pirate has no LoadBalancer VIP yet — NodePort for initial stand-up.
  # Advertise node InternalIP + allocated NodePort (UDP). Revisit when infra
  # assigns a real EXTERNAL-IP / MetalLB VIP.
  advertiseAddress: 10.14.217.16:31610
  service:
    enabled: true
    type: NodePort

enrollment:
  enabled: true
  # Chart default assumes Service name "grid-enrollment"; our Argo release
  # is grid-hub-enrollment, so the Service is release-prefixed. Cert SAN matches.
  url: https://grid-hub-enrollment-grid-enrollment.grid-enrollment.svc:8443

grid:
  peerTrust: spiffe
  signals: poll

signals:
  enabled: true
  # Required when Service is not LoadBalancer (see chart).
  advertiseAddress: 10.14.217.16:31646
  service:
    enabled: true
    type: NodePort

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.0
