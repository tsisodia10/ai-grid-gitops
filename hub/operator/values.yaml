# Hub grid-operator (0.2.0)

swim:
  siteName: hub
  service:
    enabled: true
    type: LoadBalancer
    # Optional pinned LB address once pirate assigns one:
    # loadBalancerIP: REPLACE_HUB_SWIM_IP

enrollment:
  enabled: true
  # Chart default assumes Service name "grid-enrollment"; our Argo release
  # is grid-hub-enrollment, so the Service is release-prefixed. Cert SAN matches.
  url: https://grid-hub-enrollment-grid-enrollment.grid-enrollment.svc:8443

grid:
  peerTrust: spiffe
  signals: poll

signals:
  enabled: true
  service:
    enabled: true
    type: LoadBalancer
    # loadBalancerIP: REPLACE_HUB_SIGNALS_IP

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.0
