# Hub grid-operator (0.2.0)

swim:
  siteName: hub
  # Pirate has no Service LoadBalancer allocator. Use the existing UDP NodePort.
  advertiseAddress: "10.14.217.16:31610"
  service:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local

# Local traffic policy requires the advertised node to host the operator.
nodeSelector:
  kubernetes.io/hostname: a100-03

enrollment:
  enabled: true
  # Chart default assumes Service name "grid-enrollment"; our Argo release
  # is grid-hub-enrollment, so the Service is release-prefixed. Cert SAN matches.
  url: https://grid-hub-enrollment-grid-enrollment.grid-enrollment.svc:8443

grid:
  peerTrust: spiffe
  signals: poll

signals:
  enabled: true
  advertiseAddress: "10.14.217.16:31646"
  service:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local

# These addresses reuse allocated NodePorts on the existing Services. If either
# Service is recreated, confirm its NodePort and update the matching address.

image:
  repository: ghcr.io/praxis-proxy/grid-operator
  tag: v0.2.0
