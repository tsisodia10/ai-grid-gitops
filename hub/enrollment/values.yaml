# Hub enrollment (grid-enrollment 0.2.0)
# Stable OpenShift Route host used by sites for enrollment.

host: grid-enrollment.apps.openshift.nm.rdu4.corp.redhat.com

image:
  repository: ghcr.io/praxis-proxy/grid-enrollment
  tag: v0.2.0

# Mint invites for the hub itself and for site-a.
invites:
  hub:
    network: grid
  site-a:
    network: grid

route:
  enabled: auto
  host: grid-enrollment.apps.openshift.nm.rdu4.corp.redhat.com
  tls:
    termination: passthrough
