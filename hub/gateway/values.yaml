# Hub consumer gateway (praxis-gateway 0.2.0)
# Chart default image is not the grid gateway; pin both fields.

image:
  repository: ghcr.io/praxis-proxy/grid-gateway
  tag: v0.2.0

fullnameOverride: grid-gateway

tls:
  enabled: true
  existingSecret: grid-site-identity
  caSecret: grid-ca

gatewayConfig:
  localSite: hub
  model: Qwen/Qwen3-0.6B
  # Lab / pirate only. Behind a trusted front door; use api-key in production.
  auth:
    mode: none
  backends:
    site-a:
      # pirate2 cpu-03 + grid-gateway NodePort (LB still pending)
      endpoint: 10.14.217.3:32191
      transport:
        mode: mutual_tls
        sni: site-a.grid.internal
