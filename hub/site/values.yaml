# Hub grid-site CRs (0.2.0)

gridNetwork:
  gridId: grid-1
  peerTrust:
    mode: spiffe
  signalTransport:
    mode: poll
  gatewayRefs:
    - name: grid-gateway
      namespace: grid
      localSiteName: hub

gridSite:
  name: hub
  region: us-east

# Add site-a peer after the site gateway is up and reachable from hub:
# peers:
#   site-a:
#     address: <site-gateway-host>:8080
#     region: us-west
peers: {}
