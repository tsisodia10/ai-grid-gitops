apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-hub-operator
  namespace: grid-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: grid-workloads
  sources:
    - repoURL: ghcr.io/praxis-proxy/charts
      chart: grid-operator
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $values/hub/operator/values.yaml
    - repoURL: https://github.com/tsisodia10/ai-grid-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grid
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRDs and ClusterRoles are cluster-scoped; AppProject must allow them.
