apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-site-model
  namespace: grid-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: grid-workloads
  source:
    repoURL: https://github.com/tsisodia10/ai-grid-gitops.git
    targetRevision: main
    path: site/model
  destination:
    server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/pirate2
    namespace: model
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
