apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-hub-enrollment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/praxis-proxy/charts
      chart: grid-enrollment
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $values/hub/enrollment/values.yaml
    - repoURL: REPLACE_GITOPS_REPO_URL
      targetRevision: main
      ref: values
  destination:
    name: REPLACE_HUB_DESTINATION
    namespace: grid-enrollment
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
