apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-hub-namespaces
  namespace: grid-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: grid-workloads
  source:
    repoURL: https://github.com/tsisodia10/ai-grid-gitops.git
    targetRevision: main
    path: hub
    directory:
      include: namespaces.yaml
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
