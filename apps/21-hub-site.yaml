apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-hub-site
  namespace: grid-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: grid-workloads
  sources:
    - repoURL: ghcr.io/praxis-proxy/charts
      chart: grid-site
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $values/hub/site/values.yaml
    - repoURL: https://github.com/tsisodia10/ai-grid-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: grid
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
